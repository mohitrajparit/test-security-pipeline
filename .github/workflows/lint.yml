name: Auto Linter

on:
    push:
        paths: "*.py"


jobs:
    code-linting:
        runs-on: ubuntu-latest
        steps:
            - name: checkout/clone the clone
              uses: actions/checkout@v7
            - name: Install Linter
              run: pip install ruff
            - name: Check the files for linting
              run: ruff check .

