name: CICD

on:
    workflow_dispatch:

jobs:
    code:
        runs-on: ubuntu-latest
        steps:
            - name: clone the code
              run: echo "clone the repo"
    
    build:
        runs-on: ubuntu-latest
        needs: code
        steps:
            - name: build code
              run: echo "building Code"
    test:
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: test the code
              run: echo "running thhe code"
    deploy:
        runs-on: ubuntu-latest
        needs: test
        steps:
            - name: deploy the code
              run: echo "deploying the code"